bootdelay=3
#default bootcmd, will change at runtime according to key press
#default nand boot
bootcmd=run setargs_mmc boot_normal
#kernel command arguments
earlyprintk=sunxi-uart,0x05000000
initcall_debug=0
console=ttyS0,115200
nand_root=/dev/nandd
mmc_root=/dev/mmcblk0p4
# A/B OTA: 当前活动槽。出厂为 A，OTA 时由 SWUpdate 改写切换。
#   boot_partition : U-Boot sunxi_flash read 按名读内核镜像的分区名（bootA/bootB）
#   root_partition : 仅信息用，标识当前 rootfs 槽名
#   rootdev        : 给内核 root= 的硬编码块设备（mmcblk0p4=rootfsA / mmcblk0p6=rootfsB）
# 注意：不能用 root=/dev/by-name/${root_partition}——by-name 软链接由 rootfs 起来后的
# init_ota 建立，内核挂 rootfs 阶段尚不存在，会卡在 "Waiting for root device"。
# 故内核 root= 必须用硬编码分区号，切槽时由 SWUpdate/altbootcmd 改 rootdev 变量。
boot_partition=bootA
root_partition=rootfsA
rootdev=mmcblk0p4
init=/init
rdinit=/rdinit
loglevel=8
cma=32M
mac=
wifi_mac=
bt_mac=
specialstr=
keybox_list=rpmb_key,dm_crypt_key
trace_buf_size=64M
trace_event=sched_wakeup,sched_switch,sched_blocked_reason,sched_cpu_hotplug,block,ext4
trace_enable=0

#----- A/B OTA 回滚机制（U-Boot bootcount + altbootcmd）-----
# upgrade_available=1 表示处于"升级尝试中"：每次启动 bootcount 自增，
# 超过 bootlimit 即触发 altbootcmd 切回上一个好槽。
# 用户态确认新槽正常后会 fw_setenv upgrade_available 0（commit），停止计数。
# 出厂态：upgrade_available=0，不计数。
upgrade_available=0
bootcount=0
bootlimit=3
# altbootcmd：bootcount 超限时执行，切回 A 槽并清除升级态，再正常启动。
# OTA 升级到 B 时，SWUpdate 会把本变量改写为"切回 A"；升级到 A 时反之。
# 此处默认值针对"出厂 A 槽 + 首次升级到 B"场景。
altbootcmd=setenv boot_partition bootA; setenv root_partition rootfsA; setenv rootdev mmcblk0p4; setenv upgrade_available 0; setenv bootcount 0; saveenv; run setargs_mmc boot_normal

#set kernel cmdline if boot.img or recovery.img has no cmdline we will use this
# A/B: 内核 root= 用硬编码 rootdev（mmcblk0p4/p6），不用 by-name（见上方 rootdev 注释）。
#setargs_nand=setenv bootargs console=${console} root=${nand_root} rootwait init=${init} rdinit=${rdinit} loglevel=${loglevel}  earlyprintk=${earlyprintk} initcall_debug=${initcall_debug}  loglevel=${loglevel} partitions=${partitions} cma=${cma} gpt=1
#setargs_mmc=setenv bootargs console=${console} root=${mmc_root} rootwait init=${init} rdinit=${rdinit} loglevel=${loglevel} earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} loglevel=${loglevel} partitions=${partitions} cma=${cma} gpt=1
setargs_nand=setenv bootargs console=${console} root=/dev/${rootdev} rootwait rw init=${init} rdinit=${rdinit} loglevel=${loglevel}  earlyprintk=${earlyprintk} initcall_debug=${initcall_debug}  loglevel=${loglevel} partitions=${partitions} cma=${cma} gpt=1
setargs_mmc=setenv bootargs console=${console} root=/dev/${rootdev} rootwait rw init=${init} rdinit=${rdinit} loglevel=${loglevel} earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} loglevel=${loglevel} partitions=${partitions} cma=${cma} gpt=1

#nand command syntax: sunxi_flash read address partition_name read_bytes
#0x4007f800 = 0x40080000(kernel entry) - 0x800(boot.img header 2k)
boot_normal=sunxi_flash read 45000000 ${boot_partition};bootm 45000000
boot_recovery=sunxi_flash read 45000000 recovery;bootm 45000000
boot_fastboot=fastboot
