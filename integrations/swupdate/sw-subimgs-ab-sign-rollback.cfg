# AITVBox A/B 全量+签名 swu 子镜像清单（Phase 1）。
# 对应 sw-description-ab-sign-rollback。仅 kernel + rootfs + sw-description，
# 不含 uboot/boot0（Phase 1 不升级 bootloader）。
#
# 路径约定（与 SDK stock cfg 一致）：
#   - sw-description: 相对 SDK 根（build_swu.sh 拷到 build/swupdate/）。
#   - kernel: ${LICHEE_PLAT_OUT} 绝对路径（=out/a133/b6/openwrt）。
#
# rootfs 走 gzip 压缩传输（Phase 1.5）：build_swu.sh 先把 rootfs.img 压成
# rootfs.img.gz，此处指向 .gz；包内名仍 rootfs（sw-description 的 filename
# 不变），sw-description 里 rootfs 段设 compressed="zlib"，设备端
# CONFIG_GUNZIP=y 流式解压直写分区。512M → ~110M。
#
# 打包时 swupdate_pack_swu 会把每个文件拷入 SWU_DIR 并按 :后名 命名，
# 再用 sw-description 里 sha256="@<filename>" 占位符填真实哈希（对 .gz 算）。

swota_file_list=(
build/swupdate/sw-description-ab-sign-rollback:sw-description
${LICHEE_PLAT_OUT}/boot.img:kernel
${LICHEE_PLAT_OUT}/rootfs.img.gz:rootfs
)
