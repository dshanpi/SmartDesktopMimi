[package]
name = "aitvbox-factory-core"
version = "0.1.0"
description = "Platform-neutral AITVBOX factory domain and ADB services"
authors = ["AITVBOX"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
ecdsa = { version = "0.16", features = ["der", "signing"] }
sec1 = { version = "0.7", features = ["pem"] }
signature = { version = "2", features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = "0.26"
csv = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
