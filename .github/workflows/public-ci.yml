name: Public source validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the history-free public tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/ipkvm/upstream/go.mod
          cache-dependency-path: apps/ipkvm/upstream/go.sum

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: apps/ipkvm/upstream/ui/package-lock.json

      - name: Install host build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes libjson-c-dev

      - name: Validate architecture and public boundary
        run: |
          python3 -u -m unittest -v tests.architecture.test_architecture
          python3 -u scripts/check_architecture.py

      - name: Validate host integration
        run: |
          host_log="$RUNNER_TEMP/host-integration.log"
          set +e
          env -u AITVBOX_TINA_SDK python3 -u -m unittest -v tests.platform.test_host_integration >"$host_log" 2>&1
          status=$?
          set -e
          cat "$host_log"
          if (( status != 0 )); then
            python3 -c 'import pathlib, sys; lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()[-20:]; [print("::error::" + line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")) for line in lines]' "$host_log"
          fi
          exit "$status"

      - name: Build and lint the IPKVM web UI
        working-directory: apps/ipkvm/upstream/ui
        run: |
          npm ci
          npm run build:device
          npm run lint:public

      - name: Run Go tests
        working-directory: apps/ipkvm/upstream
        run: |
          go test ./...
          go test -race ./...

      - name: Audit the public tree and deterministic SBOM
        run: |
          python3 -u tools/public_release_audit.py --candidate
          first="$(mktemp -d)"
          second="$(mktemp -d)"
          trap 'rm -rf -- "$first" "$second"' EXIT
          SOURCE_DATE_EPOCH=1700000000 python3 -u tools/generate_sbom.py --output "$first"
          SOURCE_DATE_EPOCH=1700000000 python3 -u tools/generate_sbom.py --output "$second"
          cmp "$first/aitvbox.spdx.json" "$second/aitvbox.spdx.json"
          cmp "$first/aitvbox.cdx.json" "$second/aitvbox.cdx.json"

      - name: Reject generated source-tree changes
        run: git diff --exit-code

      - name: Verify candidate repository boundary
        run: |
          test ! -e .gitmodules
          python3 tools/public_release_audit.py --candidate
