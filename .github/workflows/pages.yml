name: Build website and publish gh-pages

on:
  push:
    branches:
      - website
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate source
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f .nojekyll
          echo "2f997727d57f7d0e88a3ff8be618d6771149eaa90b6cef3dce5aa659a4505d1d  assets/SmartDesktopMimi.png" | sha256sum --check
          node --check script.js
          if grep -R -I -l -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            --exclude-dir=.git --exclude-dir=_site .; then
            echo "Private key material must never be published" >&2
            exit 1
          fi

      - name: Build static site
        run: |
          mkdir _site
          install -m 0644 index.html styles.css script.js .nojekyll _site/
          cp -a assets _site/

      - name: Publish generated site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
